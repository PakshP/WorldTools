name: GitHub Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+\+26.3'

env:
  MINECRAFT_VERSION: "26.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Gradle Wrapper Verification
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WorldTools
        run: ./gradlew build

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldTools-fabric-${{ github.ref_name }}
          path: fabric/build/libs/WorldTools-fabric-${{ github.ref_name }}.jar

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: WorldTools ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            fabric/build/libs/WorldTools-fabric-${{ github.ref_name }}.jar
